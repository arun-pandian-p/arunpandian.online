    <!-- Theme Initialization Script (Prevents FOUC - Defaults to Light) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
